<!DOCTYPE html>
<html>
<body>
<script>
const map = {
  a:"e", e:"i", i:"o", o:"u", u:"aq",
  b:"va", c:"ka", d:"ta", f:"sa", g:"ga",
  h:"ha", j:"za", k:"ki", l:"ra", m:"na",
  n:"ni", p:"ba", q:"qo", r:"la", s:"ma",
  t:"da", v:"fa", w:"wa", x:"ksa", y:"ja",
  z:"so"
};

const endings = {
  ing:"@1",
  ed:"@2",
  th:"@3"
};

function encode(text) {
  text = text.toLowerCase();

  for (const e in endings) {
    text = text.replaceAll(e, endings[e]);
  }

  let out = "";
  for (const c of text) {
    out += map[c] ?? c;
  }
  return out;
}

let input = location.hash.startsWith("#text=")
  ? decodeURIComponent(location.hash.slice(6))
  : "";

document.body.textContent = encode(input);
</script>
</body>
</html>
